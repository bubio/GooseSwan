name: Build macOS (arm64/x86_64, separate binaries)

# BubiBoyLite と同じくネイティブ 2 ランナー構成（ユニバーサルにはしない）。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  GOOSE_VERSION: v2026.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: macos-26
            goose_asset: macos-arm64
            goose_sha256: 2ffaaf46b3edde27aed03fcd9ebe73e9b6639cac30d8a6915f7dc00795b7aedf
          - arch: x86_64
            runs-on: macos-26-intel
            goose_asset: macos-x64
            goose_sha256: 3c7f2895f3dcab5f39ee52808446b00688b975620d1d27e23694dd22b82abfe7

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Goose (pinned release, checksum verified)
        env:
          GOOSE_ASSET: ${{ matrix.goose_asset }}
          GOOSE_SHA256: ${{ matrix.goose_sha256 }}
        run: |
          curl -fsSL -o /tmp/goose.tar.gz "https://github.com/aardappel/goose/releases/download/${GOOSE_VERSION}/goose-${GOOSE_VERSION}-${GOOSE_ASSET}.tar.gz"
          echo "${GOOSE_SHA256}  /tmp/goose.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/goose.tar.gz -C /tmp
          echo "/tmp/goose-${GOOSE_VERSION}-${GOOSE_ASSET}" >> "$GITHUB_PATH"

      - name: Install nasm via Homebrew
        run: brew install nasm

      - name: Cache test ROMs
        uses: actions/cache@v4
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('scripts/fetch_test_roms.sh') }}

      - name: Fetch test ROMs
        run: sh ./scripts/fetch_test_roms.sh

      - name: Cache 8086 corpus
        uses: actions/cache@v4
        with:
          path: tests/data
          key: corpus-${{ hashFiles('scripts/fetch_corpus.sh') }}

      - name: Fetch 8086 corpus
        run: sh ./scripts/fetch_corpus.sh

      - name: Build and test
        run: sh ./scripts/build_macos.sh --test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gooseswan-macos-${{ matrix.arch }}
          path: src/gooseswan
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
