name: Build Linux (amd64)

# BubiBoyLite の CI 構成を下敷きにした GooseSwan 版。
# Goose の公式リリースに linux-arm64 が無いため amd64 のみ
# （BubiBoyLite は Odin の都合で arm64 もあった）。

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-linux.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  GOOSE_VERSION: v2026.3

jobs:
  build:
    # ubuntu-22.04 でビルドすることで glibc 依存が 22.04+ に留まる
    # （Debian 12 / MX Linux 23 でも動く）。
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Goose (pinned release, checksum verified)
        env:
          GOOSE_SHA256: 06ac30284338269d3996d457412bf4f2b47c1f9a5601de65b6317187fe78d5c9
        run: |
          curl -fsSL -o /tmp/goose.tar.gz "https://github.com/aardappel/goose/releases/download/${GOOSE_VERSION}/goose-${GOOSE_VERSION}-linux-x64.tar.gz"
          echo "${GOOSE_SHA256}  /tmp/goose.tar.gz" | sha256sum -c -
          tar -xzf /tmp/goose.tar.gz -C /tmp
          echo "/tmp/goose-${GOOSE_VERSION}-linux-x64" >> "$GITHUB_PATH"

      # nasm はテスト ROM のビルド用。mesa-vulkan-drivers は
      # フロントエンドのスモーク（lavapipe で実描画させる）用。
      - name: Install nasm and Mesa (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm mesa-vulkan-drivers

      - name: Cache test ROMs
        uses: actions/cache@v4
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('scripts/fetch_test_roms.sh') }}

      - name: Fetch test ROMs
        run: sh ./scripts/fetch_test_roms.sh

      - name: Cache 8086 corpus
        uses: actions/cache@v4
        with:
          path: tests/data
          key: corpus-${{ hashFiles('scripts/fetch_corpus.sh') }}

      - name: Fetch 8086 corpus
        run: sh ./scripts/fetch_corpus.sh

      - name: Build and test
        run: sh ./scripts/build_linux.sh --test

      - name: Frontend smoke test (headless, lavapipe)
        env:
          GOOSE_GFX_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
        run: ./src/gooseswan tests/roms/WSHWTest.wsc 300 check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gooseswan-linux-amd64
          path: src/gooseswan
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
