name: CI

# One matrix for every platform Goose ships a release for
# (no linux-arm64 asset upstream, so Linux is amd64 only).
# On a published release the same run packages each build into
# gooswan-<platform>-<arch>.zip and attaches it.

on:
  push:
    branches: [main]
    paths: &paths
      - "core/**"
      - "app/**"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  GOOSE_VERSION: v2026.4

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor at 22.04+ (Debian 12 too).
          - platform: linux
            arch: amd64
            runs-on: ubuntu-22.04
            goose_asset: linux-x64.tar.gz
            goose_sha256: 559ad7572df89fcd1273512d8679528bcdf876c252ec1f31608d3808b24125b3
          - platform: macos
            arch: arm64
            runs-on: macos-26
            goose_asset: macos-arm64.tar.gz
            goose_sha256: 8ef0b5a864a719bd095b8376bed069d0edc77a0ce8f3cb9d59fdf87291a3a922
          - platform: macos
            arch: x86_64
            runs-on: macos-26-intel
            goose_asset: macos-x64.tar.gz
            goose_sha256: 471beefd5787ff96b68c1a059ac4de0973a86a540efda9f2b084b540b5d73db0
          # goose build uses the runner's Visual Studio; the scripts run in Git Bash.
          - platform: windows
            arch: x86_64
            runs-on: windows-2025
            goose_asset: windows-x64.zip
            goose_sha256: 87ceb0ff2394e0ac4154b6c6b865c084cadbf236558cc956b114f37d6e619cdb
            exe: .exe

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Goose (pinned release, checksum verified)
        env:
          GOOSE_ASSET: ${{ matrix.goose_asset }}
          GOOSE_SHA256: ${{ matrix.goose_sha256 }}
        run: |
          cd "$RUNNER_TEMP"
          file="goose-${GOOSE_VERSION}-${GOOSE_ASSET}"
          curl -fsSL -o "$file" "https://github.com/aardappel/goose/releases/download/${GOOSE_VERSION}/${file}"
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "${GOOSE_SHA256}  ${file}" | $sum -c -
          case "$file" in
            *.zip) unzip -q "$file"; dir="${file%.zip}" ;;
            *) tar -xzf "$file"; dir="${file%.tar.gz}" ;;
          esac
          echo "$RUNNER_TEMP/$dir" >> "$GITHUB_PATH"

      # nasm builds the test ROMs; Mesa (lavapipe) lets the Linux
      # frontend smoke open a GPU device.
      - name: Install nasm and Mesa (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm mesa-vulkan-drivers

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - name: Cache test ROMs
        uses: actions/cache@v6
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('scripts/fetch_test_roms.sh') }}

      - name: Fetch test ROMs
        run: sh ./scripts/fetch_test_roms.sh

      - name: Cache 8086 corpus
        uses: actions/cache@v6
        with:
          path: tests/data
          key: corpus-${{ hashFiles('scripts/fetch_corpus.sh') }}

      - name: Fetch 8086 corpus
        run: sh ./scripts/fetch_corpus.sh

      - name: Build and test
        run: |
          goose --version
          sh ./scripts/build.sh --test

      # Only Linux has a GPU stand-in (lavapipe) on the hosted runners.
      - name: Frontend smoke test (headless, lavapipe)
        if: runner.os == 'Linux'
        env:
          GOOSE_GFX_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
        run: ./app/gooswan tests/roms/WSHWTest.wsc 300 check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gooswan-${{ matrix.platform }}-${{ matrix.arch }}
          path: app/gooswan${{ matrix.exe }}
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Package and upload release zips
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Artifact names are gooswan-<platform>-<arch> (build job above).
          for dir in release-assets/gooswan-*; do
            rest="${dir##*/gooswan-}"
            sh ./scripts/package_zip.sh "$dir"/gooswan* "${rest%-*}" "${rest##*-}"
          done
          shopt -s nullglob
          zips=(gooswan-*.zip)
          [ "${#zips[@]}" -gt 0 ] || { echo "Error: no zips were produced." >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${zips[@]}" --clobber
